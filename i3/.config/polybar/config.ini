
[colors]
background = #1e1e2e
foreground = #cdd6f4
alert      = #f38ba8
blue       = #89b4fa
green      = #a6e3a1
yellow     = #f9e2af
mauve      = #cba6f7
peach      = #fab387
disabled   = #6c7086

[bar/main]
width = 100%
height = 20pt
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}


line-size = 1pt
padding = 1
module-margin = 1
separator = %{F#45475a}·%{F-}

font-0 = JetBrainsMono Nerd Font:size=9;2
font-1 = JetBrainsMono Nerd Font:size=11;3
font-2 = Symbols Nerd Font Mono:size=9;2

modules-left   = i3
modules-center = date
modules-right  = volume cpu cpu_temp load memory vpn

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 1

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false


format = <label-state>
label-focused = %index%
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.blue}
label-visible-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1

label-separator = "|"

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %Y-%m-%d %H:%M:%S
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.blue}
label-font = 2

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh watch
tail = true
click-left = ~/.config/polybar/scripts/volume.sh mute
click-right = ~/.config/polybar/scripts/volume.sh mixer
scroll-up = ~/.config/polybar/scripts/volume.sh up
scroll-down = ~/.config/polybar/scripts/volume.sh down

[module/cpu]
type = internal/cpu
interval = 5
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.green}
format-underline = ${colors.green}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.peach}
format-underline = ${colors.peach}
label = %gb_used% / %gb_total%

[module/cpu_temp]
type = custom/script
exec = ~/.config/polybar/scripts/cpu_temp.sh
interval = 5

[module/load]
type = custom/script
exec = ~/.config/polybar/scripts/load.sh
interval = 5
format-prefix = "󰓅 "
format-prefix-foreground = ${colors.yellow}
format-underline = ${colors.yellow}

