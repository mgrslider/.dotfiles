[vpn]
list = vpn_gajdy vpn_morfeusz

[module/vpn_gajdy]
type = custom/script
exec = ~/.config/polybar/scripts/vpn_generic.sh gajdy
interval = 3
click-left = ~/.config/polybar/scripts/vpn_generic.sh gajdy toggle
click-right = ~/.config/polybar/scripts/vpn_generic.sh gajdy info

[module/vpn_morfeusz]
type = custom/script
exec = ~/.config/polybar/scripts/vpn_generic.sh morfeusz
interval = 3
click-left = ~/.config/polybar/scripts/vpn_generic.sh morfeusz toggle
click-right = ~/.config/polybar/scripts/vpn_generic.sh morfeusz info

