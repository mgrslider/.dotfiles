# =============================================================================
# tmux-manager bindingi
# =============================================================================

bind-key -n C-f run-shell 'tmp=$(mktemp /tmp/tmux-mgr-XXXX); tmux display-popup -E -w 80% -h 80% "tmux-manager fzf-pick $tmp"; dir=$(cat "$tmp" 2>/dev/null); rm -f "$tmp"; [ -n "$dir" ] && tmux-manager open-path "$dir" || true'

# prefix + a — picker aktywnych sesji
bind-key a display-popup -E -w 60% -h 70% \
    "tmux-manager session-picker"

# prefix + j/k — następna/poprzednia sesja
bind-key j run-shell "tmux-manager next-session"
bind-key k run-shell "tmux-manager prev-session"

# prefix + m — nowa sesja z nazwą
bind-key m run-shell "tmux-manager new-named"
